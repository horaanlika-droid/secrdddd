<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дибитишка — открываю…</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="app/assets/mascot/icon.png">
<script>
  /* Редирект в приложение — и обязательно с сохранением query и #hash.
     Telegram Mini App передаёт tgWebAppData во фрагменте URL: если его
     потерять, веб не узнаёт пользователя → чат работает как гость
     (без имени, без записей и без памяти диалога). Поэтому здесь нет
     meta-refresh: он уносит только путь, без #hash. */
  var target = 'app/index.html' + (location.search || '') + (location.hash || '');
  location.replace(target);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: radial-gradient(90% 34% at 50% 0%, rgba(255,255,255,.9), transparent 70%),
                     linear-gradient(180deg, #D7E4FA, #F4F8FF); color: #0B1F4D;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { text-align: center; padding: 32px; }
  .hero { width: min(72vw, 300px); height: auto; margin: 0 auto;
          filter: drop-shadow(0 0 44px rgba(255,255,255,.95)) drop-shadow(0 26px 34px rgba(47,125,246,.32));
          animation: float 5.5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  .hint { color: #5A6B8C; font-size: 15px; margin-top: 26px; line-height: 1.7; }
  .hint a { color: #2F7DF6; }
</style>
</head>
<body>
<div class="card">
  <img class="hero" src="app/assets/brand/splash-lockup.png" alt="Дибитишка" width="914" height="537">
  <p class="hint">открываю приложение…<br>
  если не перешло — <a href="app/index.html">войди в приложение</a></p>
</div>
</body>
</html>
