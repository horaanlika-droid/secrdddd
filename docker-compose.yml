services:
  bot:
    build: .
    image: dibitishka-bot
    container_name: dibitishka-bot
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      DB_FILE: /data/db.json
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - bot-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bot-data:
