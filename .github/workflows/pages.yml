name: GitHub Pages

# Публикует папку app/ как сайт.
#
# ВАЖНО: этот workflow нужен, ТОЛЬКО если в Settings → Pages → Build and
# deployment → Source выбран «GitHub Actions». Если там стоит «Deploy from a
# branch» (main, /), сайт собирает уже сам GitHub, а действия
# upload-pages-artifact/deploy-pages обязанно падают — поэтому ниже режим
# определяется автоматически и workflow просто ничего не делает (зелёный),
# объясняя в логе, что происходит. Оба режима дают один результат: по адресу
# открывается приложение, а не README (в корне лежит index.html с редиректом
# в app/index.html, #hash для Telegram он сохраняет, .nojekyll выключает Jekyll).
#
# Триггер — только main: ветки вида arena/* временные, ловить их сюда смысла нет
# (и проверка проекта на это смотрит).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mode:
    name: как публиковать Pages
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: смотрим Source в настройках Pages
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          echo "build_type=$bt"
          if [ "$bt" != "dynamic" ]; then
            echo "Pages публикуется из ветки (source=branch) — публикацию делает GitHub, workflow пропускаю."
            echo "Хочешь сборку отсюда: Settings → Pages → Source → GitHub Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Source = GitHub Actions — публикуем app/."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: pages build
    needs: mode
    if: needs.mode.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: проверяем, что публиковать есть что
        run: |
          test -f app/index.html || { echo "нет app/index.html — публиковать нечего"; exit 1; }
          test -f app/content/content.json || echo "предупреждение: нет app/content/content.json"
          echo "публикуем $(find app -type f | wc -l) файлов из app/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    name: pages deploy
    needs: [mode, build]
    if: needs.mode.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: проверяем, что открывается приложение, а не README
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "жду $url"
          body=""
          for i in $(seq 1 18); do
            body="$(curl -sL --max-time 20 "$url" || true)"
            if [ -n "$body" ]; then break; fi
            sleep 10
          done
          if [ -z "$body" ]; then echo "сайт не ответил за 3 минуты"; exit 1; fi
          if echo "$body" | grep -q "app/index.html"; then
            echo "ок: $url ведёт в приложение"
          else
            echo "на $url открывается НЕ приложение. Первые строки:"
            echo "$body" | head -30
            exit 1
          fi
