name: checks

# Проверки на будущие конфликты: падают ДО деплоя, если зависимости
# потерялись, lockfile разошёлся с package.json, точка входа снова
# импортирует grammy напрямую или образ не собирается.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: зависимости и структура
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bot/package-lock.json
            package-lock.json

      # npm ci падает сам, если package.json и package-lock.json разошлись
      - name: зависимости бота
        working-directory: bot
        run: npm ci --omit=dev --no-audit --no-fund

      - name: зависимости корня (для хостов, ставящих в корне репозитория)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: все зависимости резолвятся из bot/src
        run: node bot/src/ensure-deps.js --check

      - name: проверка проекта на будущие конфликты
        run: node scripts/check-project.mjs

  smoke:
    name: бот поднимается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: зависимости
        working-directory: bot
        run: npm ci --omit=dev --no-audit --no-fund
      - name: смоук-тест (/health и /content.json)
        run: node scripts/smoke.mjs
      - name: Tribute — постоянная ссылка, подпись, monthly и дедупликация
        run: npm run tribute-test
      # Живой чат против подставного OpenAI: 400 Unsupported parameter,
      # insufficient_quota, таймауты — чинятся сами, и это не должно отвалиться.
      - name: живой чат — параметры модели и коды ошибок (мок OpenAI)
        run: npm run ai-test
      # Контракт Agents API (сессия, exec-server, поток событий) — против
      # подставного API: чтобы «сессия + окружение» не развалилось в проде.
      - name: agents-бэкенд — сессия, исполнитель, поток событий (мок API)
        run: npm run agents-test
      - name: автоочистка порта при деплое
        run: node scripts/port-clash.mjs

  web:
    name: веб — поведение, фото и доски
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: jsdom — экраны, подтверждение эмоций, IndexedDB и листы
        run: npm run dom-test
      - name: приватные доски — авторизация, конфликты, очередь и EXIF
        run: npm run boards-test
      # Бинауральные ритмы: математика тонов и движок Web Audio на моке.
      - name: бинауральные ритмы — частоты, каналы, таймер и затухание
        run: npm run sound-test
      - name: тетрадь — оплаченный доступ и превью
        run: npm run workbook-test
      - name: стикеры — публикация и права
        run: npm run stickers-test
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: мобильная вёрстка, реальные фото и экспорт
        run: npm run browser-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-screenshots
          path: test-results/ui

  self-heal:
    name: бот сам ставит зависимости
    # воспроизводит аварию «Cannot find package 'grammy'»: node_modules нет
    # вовсе — точка входа обязана поставить их сама и подняться
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: убеждаемся, что зависимостей нет
        run: |
          rm -rf bot/node_modules node_modules
          node bot/src/ensure-deps.js --check && { echo "ожидался провал проверки"; exit 1; } || echo "ок: зависимостей нет, как в аварии"
      - name: запуск с нуля — бот ставит зависимости сам
        run: node scripts/smoke.mjs
      - name: после автоустановки проверка чистая
        run: node bot/src/ensure-deps.js --check

  docker:
    name: образ собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (внутри — проверка зависимостей и смоук-тест)
        run: docker build -t dibitishka-bot .
