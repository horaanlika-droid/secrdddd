<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yo Kit — мини-приложение · Столярочка Yo</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('assets/fonts/inter-cyrillic-wght-normal.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+FEFF,U+FFFD;}
:root{
  --bg:#f1ede2;            /* тёплая бумага вместо #efeff4 */
  --card:#fdfbf5;          /* тёплый белый вместо #ffffff */
  --ink:#1d3350;           /* наш чернильный вместо #000 */
  --hint:#8d97a5;
  --sep:rgba(29,51,80,.16);
  --sep2:rgba(29,51,80,.09);
  --acc:#b3762f;           /* дерево вместо #3390ec */
  --acc2:#c98d4b;
  --acct:rgba(179,118,47,.12);
  --red:#c2452d;           /* красный карандаш вместо #ff3b30 */
  --green:#5d8a54;         /* наш шалфей вместо системного зелёного */
  --bubout:#f4e6c9;        /* исходящий баббл — тёплый тон дерева */
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:#d9d3c4;font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
#app{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:500px){body{padding:24px 0}#app{border-radius:30px;box-shadow:0 30px 80px rgba(40,32,18,.4);outline:8px solid #10161d}}
/* ---------- nav bar (TG iOS) ---------- */
nav.nv{height:50px;flex:0 0 50px;display:flex;align-items:center;padding:0 8px;position:relative;z-index:4;background:var(--bg)}
nav.nv .l,nav.nv .r{width:86px;display:flex;align-items:center;gap:4px;font-size:16.5px;color:var(--acc);cursor:pointer;background:none;border:0;font-family:inherit;padding:6px}
nav.nv .r{justify-content:flex-end;text-align:right}
nav.nv .t{flex:1;text-align:center;font-size:16.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.nv .l svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 22px}
/* ---------- scroll & lists ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:8px}
main::-webkit-scrollbar{display:none}
main.pad{padding:0 0 96px}
main.tabs{padding:0 0 70px}
.grp{margin:0 16px 8px;background:var(--card);border-radius:var(--r);overflow:hidden}
.hd{font-size:13px;color:var(--hint);margin:18px 32px 7px;letter-spacing:.02em}
.hd.up{text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.ft{font-size:13px;color:var(--hint);margin:7px 32px 0;line-height:1.45}
.rw{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:46px;background:var(--card);position:relative;cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.rw+.rw::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--sep2)}
.rw.noic+.rw::before,.rw+.rw.noic::before{left:16px}
.rw .ic{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#fff}
.rw .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rw .tx{flex:1;min-width:0}
.rw .tx b{display:block;font-size:16.5px;font-weight:480;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .tx span{display:block;font-size:13px;color:var(--hint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .v{font-size:16px;color:var(--hint);flex:0 1 auto;white-space:nowrap}
.rw .ch{width:8px;height:14px;flex:0 0 8px;stroke:rgba(29,51,80,.32);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rw .ck{width:20px;height:20px;stroke:var(--acc);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 20px}
.rw.danger .tx b{color:var(--red);text-align:center;font-weight:500}
.rw.center{justify-content:center}
/* степпер в строке (наш компакный, в духе inline-контролов TG) */
.stp{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stp button{border:0;background:none;color:var(--acc);font-size:22px;font-weight:400;width:30px;height:30px;line-height:1;cursor:pointer;font-family:inherit;padding:0}
.stp .n{font-size:16px;color:var(--ink);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.stp .n small{color:var(--hint);font-size:12px}
/* segmented (iOS) */
.seg{display:flex;background:rgba(29,51,80,.09);border-radius:9px;padding:2px;gap:2px;margin:2px 16px 12px}
.seg button{flex:1;border:0;border-radius:7px;background:transparent;color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;padding:7px 4px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(29,51,80,.18);font-weight:600}
/* switch iOS */
.sw{width:51px;height:31px;border-radius:16px;background:rgba(29,51,80,.16);position:relative;cursor:pointer;flex:0 0 51px;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--acc2)}
.sw.on::after{left:22px}
/* media card with drawing */
.media{margin:6px 16px 2px;background:var(--card);border-radius:var(--r);padding:10px 8px 8px;position:relative}
.media svg{display:block;width:100%;height:auto}
.media .cap{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--hint);padding:6px 4px 4px;font-variant-numeric:tabular-nums}
.media .cap b{color:var(--ink);font-weight:600}
.media .tag{position:absolute;top:10px;left:12px;font-size:11px;font-weight:600;color:var(--acc);background:var(--acct);padding:3px 8px;border-radius:6px}
/* main button (TG MainButton) */
.mb{position:absolute;left:12px;right:12px;bottom:66px;height:50px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-family:inherit;font-size:16px;font-weight:600;letter-spacing:-.1px;cursor:pointer;z-index:6;box-shadow:0 6px 18px rgba(179,118,47,.35)}
.mb:active{filter:brightness(.95)}
/* tab bar iOS */
.tb{flex:0 0 56px;background:var(--bg);border-top:1px solid var(--sep);display:flex;position:relative;z-index:5}
.tb button{flex:1;border:0;background:none;font-family:inherit;color:var(--hint);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tb button.on{color:var(--acc)}
.tb svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* action sheet iOS */
.bk{position:absolute;inset:0;background:rgba(20,16,8,.42);z-index:8;opacity:0;pointer-events:none;transition:.18s}
.bk.on{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;z-index:9;transform:translateY(102%);transition:.22s cubic-bezier(.2,.8,.2,1);padding:0 8px 10px}
.sh.on{transform:none}
.sh .box{background:rgba(253,251,245,.96);border-radius:14px;overflow:hidden;backdrop-filter:blur(20px)}
.sh .box+.box{margin-top:8px}
.sh .it{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:none;border:0;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;position:relative}
.sh .it+.it::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep2)}
.sh .it .ic{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#fff}
.sh .it .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sh .it b{font-size:16.5px;font-weight:480;display:block;color:var(--ink)}
.sh .it span{font-size:12.5px;color:var(--hint);display:block;margin-top:1px}
.sh .cancel{width:100%;padding:14px;background:none;border:0;font-family:inherit;font-size:17px;font-weight:600;color:var(--red);cursor:pointer}
/* chat TG */
.chat{padding:8px 12px 96px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.35;position:relative}
.bub.in{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:0 1px 1px rgba(29,51,80,.08)}
.bub.out{align-self:flex-end;background:var(--bubout);border-bottom-right-radius:6px}
.bub .tm{float:right;font-size:11.5px;color:var(--hint);margin:6px 0 -2px 8px;display:flex;align-items:center;gap:3px}
.bub .tm svg{width:15px;height:15px;stroke:var(--acc);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bub .spec{margin-top:6px;background:rgba(253,251,245,.75);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5}
.bub .spec b{display:block;font-size:13px;font-weight:650;margin-bottom:2px}
.cbar{position:absolute;left:0;right:0;bottom:0;background:var(--bg);padding:6px 10px;display:flex;gap:8px;align-items:flex-end;z-index:6}
.cbar .fld{flex:1;background:var(--card);border-radius:20px;padding:9px 14px;font-size:15px;color:var(--hint);display:flex;align-items:center;gap:8px}
.cbar .fld svg{width:20px;height:20px;stroke:var(--hint);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cbar .snd{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 38px}
.cbar .snd svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* progress (iOS linear) */
.pr{height:4px;border-radius:2px;background:rgba(29,51,80,.12);overflow:hidden;margin:2px 16px 12px}
.pr i{display:block;height:100%;background:var(--acc);border-radius:2px}
/* swatch dot */
.dot{width:26px;height:26px;border-radius:8px;flex:0 0 26px;border:1px solid var(--sep)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <nav class="nv" id="nv">
    <button class="l" id="nvL"></button>
    <div class="t" id="nvT"></div>
    <button class="r" id="nvR"></button>
  </nav>
  <main id="main"></main>
  <div class="tb" id="tb" hidden>
    <button data-tab="build"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20V9l6-4 6 4v11"/><path d="M10 20v-5h4v5"/></svg>Конструктор</button>
    <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg>Заказы</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>Ещё</button>
  </div>
  <button class="mb" id="mb" hidden></button>
  <div class="bk" id="bk"></div>
  <div class="sh" id="sh"></div>
</div>
<script>
/* ================= данные ================= */
const M=[
 {id:'plywood',n:'Берёзовая фанера',d:'слоистый торец · тёплый светлый тон',c:'#d9b57e'},
 {id:'oak',n:'Массив дуба',d:'плотная текстура · медовый оттенок',c:'#c09256'},
 {id:'ash',n:'Массив ясеня',d:'светлый · крупный рисунок',c:'#d8c49a'},
 {id:'walnut',n:'Массив ореха',d:'тёмный шоколадный · благородный',c:'#6f4a2e'},
 {id:'beech',n:'Массив бука',d:'ровный розовато-медовый тон',c:'#cf9d6d'},
 {id:'karagach',n:'Карагач',d:'свилеватый рисунок · слэбы',c:'#9c6836'},
 {id:'slab',n:'Слэб массива',d:'живой край · цельная плита',c:'#8a5a30'},
 {id:'veneer',n:'Шпон',d:'срез ценной породы на основе',c:'#b78b58'},
 {id:'hpl',n:'HPL-пластик',d:'любой цвет · стойкая поверхность',c:'#5a6672'},
];
const FIN=[{id:'oil',n:'Масловоск'},{id:'lac',n:'Матовый лак'},{id:'brush',n:'Браширование'},{id:'resin',n:'Синяя смола'}];
const HW=[{id:'hidden',n:'Скрытая фурнитура'},{id:'black',n:'Чёрный металл'},{id:'brass',n:'Латунь'}];
const FILLS={shelves:'Полки',drawers:'Ящики',doors:'Фасады',open:'Открытая секция'};
const TOPS={body:'В корпус',slab:'Слэб массива',concrete:'Бетон'};
/* состояние проекта: стек блоков снизу вверх */
const S={
  screen:'build', sheet:null, sel:0,
  w:2000, d:600, mat:'walnut', fin:'oil', hw:'hidden', measure:false,
  blocks:[
    {t:'base',kind:'plinth'},
    {t:'section',h:650,fill:'drawers',n:2,div:0},
    {t:'section',h:550,fill:'shelves',n:2,div:1},
    {t:'top',kind:'slab'},
  ],
};
const bh=b=> b.t==='base' ? (b.kind==='legs'?150:100) : b.t==='top' ? ({body:0,slab:45,concrete:55}[b.kind]) : b.h;
const totalH=()=>S.blocks.reduce((s,b)=>s+bh(b),0);
const mat=()=>M.find(m=>m.id===S.mat);
/* пресеты для съёмки */
(function(){const q=new URLSearchParams(location.search);
  if(q.get('sheet'))S.sheet=q.get('sheet');
  if(q.get('sel'))S.sel=+q.get('sel');
  if(q.get('w'))S.w=+q.get('w');
})();
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const mm=v=>v.toLocaleString('ru-RU');
const ICON={
 back:'<path d="M14.5 4.5L7 12l7.5 7.5"/>', chev:'<path d="M9 4.5L16.5 12 9 19.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M4.5 12.5l5 5L19.5 7"/>',
 ticks:'<path d="M2 12.5l4 4L15 7"/><path d="M9 15.5l1.5 1.5L20 7"/>',
 base:'<path d="M4 18h16"/><path d="M6 18v-4h12v4"/><path d="M5 14V9h14v5"/>',
 section:'<rect x="4.5" y="4.5" width="15" height="15" rx="1.5"/><path d="M4.5 12h15"/>',
 top:'<path d="M3 9h18v3H3z"/><path d="M6 12v6M18 12v6"/>',
 legs:'<path d="M4 8h16"/><path d="M6 8v10M18 8v10"/>',
 phone:'<path d="M6 3.5h4l1.5 4-2.2 1.6a12 12 0 005.6 5.6l1.6-2.2 4 1.5v4a1.8 1.8 0 01-2 1.8C10.4 19.2 4.8 13.6 4.2 5.5a1.8 1.8 0 011.8-2z"/>',
 mail:'<rect x="3.5" y="5.5" width="17" height="13" rx="2.2"/><path d="M4 7l8 6 8-6"/>',
 pin:'<path d="M12 21s7-6.1 7-11a7 7 0 10-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
 tg:'<path d="M21 5L3.6 11.6l5 1.7L10.4 19l3-3.6 4.6 3.4z"/>',
 file:'<path d="M7 3.5h7l4 4V20a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 016 20V5A1.5 1.5 0 017.5 3.5z"/><path d="M14 3.5V8h4"/>',
 leaf:'<path d="M5 19C5 9 12 4 20 4c0 9-5 15-13 15"/><path d="M5 19c3-5 7-8 11-10"/>',
 ext:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 13v6a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 014 19V8a1.5 1.5 0 011.5-1.5H11"/>',
 up:'<path d="M12 19V6"/><path d="M6 12l6-6 6 6"/>', down:'<path d="M12 5v13"/><path d="M6 12l6 6 6-6"/>',
 trash:'<path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 13h8l1-13"/>',
 clip:'<path d="M8 4.5h8a3 3 0 013 3V19a2.5 2.5 0 01-2.5 2.5h-9A2.5 2.5 0 017 19V6a2 2 0 014 0v11a1 1 0 01-2 0V8"/>',
 mic:'<rect x="9.5" y="3.5" width="5" height="10" rx="2.5"/><path d="M6 11a6 6 0 0012 0"/><path d="M12 17v3.5"/>',
 send:'<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
 info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.4"/>',
};
const sv=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${ICON[n]}</svg>`;
/* ================= аксонометрия стека ================= */
const C30=Math.cos(Math.PI/6);
function P(x,y,z){return [(x-y)*C30,(x+y)*0.5-z];}
function stackSVG(){
  const W=S.w,D=S.d,H=totalH();
  /* габариты для масштаба */
  const pts=[];[[0,0,0],[W,0,0],[0,D,0],[W,D,0],[0,0,H],[W,0,H],[0,D,H],[W,D,H]].forEach(p=>pts.push(P(...p)));
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  pts.forEach(([a,b])=>{mnx=Math.min(mnx,a);mxx=Math.max(mxx,a);mny=Math.min(mny,b);mxy=Math.max(mxy,b);});
  const vw=358,vh=236,pad=16;
  const k=Math.min((vw-pad*2-74)/(mxx-mnx),(vh-pad*2-26)/(mxy-mny));
  const ox=pad+((vw-pad*2-46)-(mxx-mnx)*k)/2-mnx*k, oy=pad+((vh-pad*2-26)-(mxy-mny)*k)/2-mny*k+8;
  const T=(x,y,z)=>{const[a,b]=P(x,y,z);return[ox+a*k,oy+b*k];};
  const LN='#9aa4b0', face=(poly,fill,stroke=LN,sw=1.25,fo='')=>`<path d="${poly.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}Z" fill="${fill}" ${fo} stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  let g='',z=0;
  S.blocks.forEach((b,bi)=>{
    const h=bh(b), sel=bi===S.sel;
    const st=sel?'#b3762f':LN, sw=sel?2:1.25, wash=sel?'fill-opacity=".10"':'' , wf= sel?'#c98d4b':'#ffffff';
    if(b.t==='base'){
      if(b.kind==='legs'){[[50,50],[W-100,50],[50,D-100],[W-100,D-100]].forEach(([x,y])=>{
        g+=face([T(x,y+h,h),T(x+50,y+h,h),T(x+50,y,h),T(x,y,h)],wf,st,sw,wash);
        g+=face([T(x+50,y,h+0),T(x+50,y+h,h),T(x+50,y+h,0+0),T(x+50,y,0)],wf,st,sw,wash);
        g+=face([T(x,y+h,h),T(x+50,y+h,h),T(x+50,y+h,0),T(x,y+h,0)],wf,st,sw,wash);
        g+=face([T(x,y+h,h),T(x,y+h,0),T(x+50,y+h,0),T(x+50,y+h,h)],wf,st,sw,wash);
      });}
      else{
        g+=face([T(60,D-60,h),T(W-60,D-60,h),T(W-60,D-60,0),T(60,D-60,0)],wf,st,sw,wash);
        g+=face([T(W-60,60,h),T(W-60,D-60,h),T(W-60,D-60,0),T(W-60,60,0)],wf,st,sw,wash);
        g+=face([T(60,60,h),T(W-60,60,h),T(W-60,D-60,h),T(60,D-60,h)],wf,st,sw,wash);
      }
    }
    if(b.t==='section'){
      g+=face([T(0,D,h),T(W,D,h),T(W,D,z),T(0,D,z)],wf,st,sw,wash);
      g+=face([T(W,0,h),T(W,D,h),T(W,D,z),T(W,0,z)],wf,st,sw,wash);
      g+=face([T(0,0,h),T(W,0,h),T(W,D,h),T(0,D,h)],wf,st,sw,wash);
      /* фасад на +y */
      const t=40, ix=t, iw=W-2*t, iz=z+t, ih=h-2*t;
      if(b.fill==='shelves'||b.fill==='open'){
        g+=face([T(ix,D,iz+ih),T(ix+iw,D,iz+ih),T(ix+iw,D,iz),T(ix,D,iz)],'#1d3350',st,1,'fill-opacity=".07"');
        for(let i=1;i<=(b.fill==='shelves'?b.n:0);i++){const zz=iz+ih*i/(b.n+1);const a=T(ix,D,zz),c=T(ix+iw,D,zz);g+=`<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" stroke="${st}" stroke-width="1.2"/>`;}
        for(let i=1;i<=b.div;i++){const xx=ix+iw*i/(b.div+1);const a=T(xx,D,iz),c=T(xx,D,iz+ih);g+=`<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" stroke="${st}" stroke-width="1.2"/>`;}
      }
      if(b.fill==='drawers'){const gr=24,rh=(ih-gr*(b.n-1))/b.n;
        for(let i=0;i<b.n;i++){const z0=iz+i*(rh+gr);
          g+=face([T(ix,D+20,z0+rh),T(ix+iw,D+20,z0+rh),T(ix+iw,D+20,z0),T(ix,D+20,z0)],wf,st,1.1,wash);
          g+=face([T(ix,D,z0+rh),T(ix,D+20,z0+rh),T(ix+iw,D+20,z0+rh),T(ix+iw,D,z0+rh)],wf,st,1,wash);
          if(S.hw!=='hidden'){const a=T(ix+iw/2-50,D+20,z0+rh/2),c=T(ix+iw/2+50,D+20,z0+rh/2);g+=`<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}" stroke="${S.hw==='brass'?'#a8802a':st}" stroke-width="2.4"/>`;}}}
      if(b.fill==='doors'){const gr=24,dw=(iw-gr*(b.n-1))/b.n;
        for(let i=0;i<b.n;i++){const x0=ix+i*(dw+gr);
          g+=face([T(x0,D+18,iz+ih),T(x0+dw,D+18,iz+ih),T(x0+dw,D+18,iz),T(x0,D+18,iz)],wf,st,1.1,wash);
          g+=face([T(x0,D,iz+ih),T(x0,D+18,iz+ih),T(x0+dw,D+18,iz+ih),T(x0+dw,D,iz+ih)],wf,st,1,wash);
          if(S.hw!=='hidden'){const p=T(x0+dw-50,D+18,iz+ih/2);g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${S.hw==='brass'?'#a8802a':st}"/>`;}}}
    }
    if(b.t==='top'&&b.kind!=='body'){
      const tc=b.kind==='concrete'?'#aab0b6':'#c9a06a';
      g+=face([T(-40,D+40,z+h),T(W+40,D+40,z+h),T(W+40,D+40,z),T(-40,D+40,z)],tc,st,sw,sel?'fill-opacity=".55"':'fill-opacity=".38"');
      g+=face([T(W+40,-40,z+h),T(W+40,D+40,z+h),T(W+40,D+40,z),T(W+40,-40,z)],tc,st,sw,sel?'fill-opacity=".55"':'fill-opacity=".38"');
      g+=face([T(-40,-40,z+h),T(W+40,-40,z+h),T(W+40,D+40,z+h),T(-40,D+40,z+h)],tc,st,sw,sel?'fill-opacity=".55"':'fill-opacity=".38"');
    }
    z+=h;
  });
  /* габаритные линии */
  let dm='';const L=(a,b,w=.9)=>`<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}" stroke="#b6bdc7" stroke-width="${w}"/>`;
  const w1=T(0,D,-90),w2=T(W,D,-90);
  dm+=L(T(0,D,0),w1)+L(T(W,D,0),w2)+L(w1,w2,1.1);
  dm+=`<text x="${((w1[0]+w2[0])/2).toFixed(1)}" y="${((w1[1]+w2[1])/2+14).toFixed(1)}" font-family="Inter" font-size="10.5" font-weight="600" fill="#8d97a5" text-anchor="middle">${mm(W)}</text>`;
  const d1=T(W+150,0,0),d2=T(W+150,D,0);
  dm+=L(T(W,0,0),d1)+L(T(W,D,0),d2)+L(d1,d2,1.1);
  dm+=`<text x="${((d1[0]+d2[0])/2+4).toFixed(1)}" y="${((d1[1]+d2[1])/2+12).toFixed(1)}" font-family="Inter" font-size="10.5" font-weight="600" fill="#8d97a5" text-anchor="middle">${mm(D)}</text>`;
  const h1=d2,h2=T(W+150,D,H);
  dm+=L(h1,h2,1.1);
  dm+=`<text x="${(h2[0]+8).toFixed(1)}" y="${((h1[1]+h2[1])/2).toFixed(1)}" font-family="Inter" font-size="10.5" font-weight="600" fill="#8d97a5" text-anchor="middle" transform="rotate(-90 ${(h2[0]+8).toFixed(1)} ${((h1[1]+h2[1])/2).toFixed(1)})">${mm(H)}</text>`;
  return `<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">${g}${dm}</svg>`;
}
/* ================= spec ================= */
function spec(){
  let parts=0,area=0;
  S.blocks.forEach(b=>{
    if(b.t==='base')parts+=b.kind==='legs'?4:1;
    if(b.t==='section'){parts+=4+b.div+(b.fill==='shelves'?b.n:b.fill==='drawers'?b.n*3:b.fill==='doors'?b.n*2:0);
      area+=(S.w*b.h*2+S.w*S.d+S.h===0?0:0)/1e6; area+=(2*S.w*b.h+2*S.d*b.h+S.w*S.d)/1e6;}
    if(b.t==='top')parts+=1;
  });
  area=(2*S.w*totalH()+2*S.d*totalH()+S.w*S.d)/1e6;
  const weeks=3+(area>2.5?1:0)+(S.blocks.some(b=>b.t==='top'&&b.kind==='slab')?1:0);
  return {parts,area,weeks};
}

function nav(title,left,right){
  $('#nvT').textContent=title;
  const L=$('#nvL'),R=$('#nvR');
  if(left){L.hidden=false;L.innerHTML=sv('back')+`<span>${left[0]}</span>`;L.onclick=left[1];}
  else{L.hidden=true;L.innerHTML='';L.onclick=null;}
  if(right){R.hidden=false;R.textContent=right[0];R.onclick=right[1];}
  else{R.hidden=true;R.textContent='';R.onclick=null;}
}
function tabs(on){const t=$('#tb');t.hidden=!on;t.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===on));}
function mainBtn(label,fn){const b=$('#mb');if(!label){b.hidden=true;b.onclick=null;return;}b.hidden=false;b.textContent=label;b.onclick=fn;}
function sheet(kind){S.sheet=kind;renderSheet();}
function renderSheet(){
  const bk=$('#bk'),sh=$('#sh');
  const on=!!S.sheet;
  bk.classList.toggle('on',on);sh.classList.toggle('on',on);
  bk.onclick=()=>sheet(null);
  if(!on){sh.innerHTML='';return;}
  if(S.sheet==='add'){
    sh.innerHTML=`<div class="box">
      <button class="it" onclick="addBlock('base')"><span class="ic" style="background:#8d97a5">${sv('legs')}</span><span><b>Основание</b><span>цоколь или ножки · низ сборки</span></span></button>
      <button class="it" onclick="addBlock('section')"><span class="ic" style="background:#b3762f">${sv('section')}</span><span><b>Секция</b><span>модуль хранения: полки, ящики, фасады</span></span></button>
      <button class="it" onclick="addBlock('top')"><span class="ic" style="background:#5d8a54">${sv('top')}</span><span><b>Столешница</b><span>в корпус, слэб массива или бетон</span></span></button>
    </div><div class="box"><button class="cancel" onclick="sheet(null)">Отмена</button></div>`;
  }
  if(S.sheet==='fin'){
    sh.innerHTML=`<div class="box">${FIN.map(f=>`<button class="it" onclick="S.fin='${f.id}';sheet(null);render()"><span><b>${f.n}</b></span>${S.fin===f.id?`<span style="margin-left:auto;color:var(--acc)">${sv('check')}</span>`:''}</button>`).join('')}</div>
    <div class="box"><button class="cancel" onclick="sheet(null)">Отмена</button></div>`;
  }
  if(S.sheet==='hw'){
    sh.innerHTML=`<div class="box">${HW.map(f=>`<button class="it" onclick="S.hw='${f.id}';sheet(null);render()"><span><b>${f.n}</b></span>${S.hw===f.id?`<span style="margin-left:auto;color:var(--acc)">${sv('check')}</span>`:''}</button>`).join('')}</div>
    <div class="box"><button class="cancel" onclick="sheet(null)">Отмена</button></div>`;
  }
}

/* ================= actions ================= */
function go(s){S.screen=s;location.hash=s;render();}
function render(){ $('#main').innerHTML=screens[S.screen](); $('#main').scrollTop=0; renderSheet(); }
function addBlock(t){
  const b=t==='base'?{t:'base',kind:'plinth'}:t==='top'?{t:'top',kind:'slab'}:{t:'section',h:600,fill:'shelves',n:1,div:0};
  if(t==='base')S.blocks.unshift(b); else if(t==='top')S.blocks.push(b); else S.blocks.splice(Math.max(0,S.blocks.findIndex(x=>x.t==='top')),0,b);
  S.sel=S.blocks.indexOf(b); sheet(null); go('block');
}
function bh_(dv){const b=S.blocks[S.sel];b.h=Math.max(200,Math.min(1400,b.h+dv));render();}
function bn_(dv){const b=S.blocks[S.sel];b.n=Math.max(1,Math.min(4,b.n+dv));render();}
function bd_(dv){const b=S.blocks[S.sel];b.div=Math.max(0,Math.min(2,b.div+dv));render();}
function gw(dv){S.w=Math.max(600,Math.min(3000,S.w+dv));render();}
function gd(dv){S.d=Math.max(300,Math.min(1200,S.d+dv));render();}
function mv(dv){const i=S.sel,j=i+dv;if(j<0||j>=S.blocks.length)return;[S.blocks[i],S.blocks[j]]=[S.blocks[j],S.blocks[i]];S.sel=j;render();}
function del(){S.blocks.splice(S.sel,1);S.sel=Math.max(0,S.sel-1);go('build');}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(screens[h]){S.screen=h;render();}});
$('#tb').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
(function(){const h=location.hash.slice(1);if(screens[h])S.screen=h;render();})();
</script>
